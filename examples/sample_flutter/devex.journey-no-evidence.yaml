schemaVersion: 2

content:
  root: .devex

workspace:
  id: sample-flutter
  displayName: Sample Flutter consumer

applications:
  sample:
    root: .
    target: web
    displayName: Sample Flutter

kit:
  # Start from a packaged profile and remove every unrelated effect. This
  # proves that Journey Map is useful as a structural board without requiring
  # an EvidenceProvider.
  profile: gateway-lab
  modules:
    artifact-store.local:
      enabled: false
    sessions.local:
      enabled: false
    gateway.interceptor:
      enabled: false
    studio.journey-map:
      enabled: true
