schemaVersion: 2

content:
  root: .devex

workspace:
  id: devex-showcase
  displayName: DevExKit complete showcase

applications:
  sample:
    root: .
    target: web
    displayName: Delivery Lab Flutter

# LaunchProfiles are inert until a user explicitly starts a Target session.
# Commands execute without a shell and inside the confined consumer workspace.
launchProfiles:
  sample-web:
    applicationId: sample
    platform: web
    command: dart
    arguments:
      - run
      - tool/devex_target_server.dart
      - --root=build/web
      - --port=8080
      - --frame-ancestor=http://127.0.0.1:7368
    workingDirectory: .
    overlay:
      DEVEX_EXAMPLE_MODE: full
    bootstrapPolicy:
      sample-api: production
      gateway: overlay

kit:
  profile: full-local
  # full-local is the canonical inventory and currently enables all 17
  # packaged modules. Workspace overlays below configure only what differs
  # from the profile so --profile remains a useful diagnostic override.
  modules:
    evidence.auto-preview:
      enabled: true
      settings:
        renderer: flutter-test
        capturePolicy: static-v1
        parallelism: 1
  providerBindings:
    - capability: {id: evidence.visual, version: 1}
      providerModuleIds:
        - evidence.auto-preview
      selectionPolicy: orderedFirstAvailable
      applicationId: sample
  startupPolicy: fail-required-v1
