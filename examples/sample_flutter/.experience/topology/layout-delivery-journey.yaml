schemaVersion: 2
kind: ProjectionLayout
metadata:
  id: delivery-journey
spec:
  projectionId: delivery-journey
  nodeFrames:
    - nodeInstanceId: journey-dashboard-loading
      x: 60
      y: 220
      width: 220
      height: 120
      laneId: journey-direct-lane
    - nodeInstanceId: journey-dashboard-ready
      x: 360
      y: 220
      width: 220
      height: 120
      groupId: journey-branch-merge-group
      laneId: journey-direct-lane
    - nodeInstanceId: journey-toggle-delivery-task
      x: 700
      y: 40
      width: 220
      height: 120
      groupId: journey-branch-merge-group
      laneId: journey-task-lane
    - nodeInstanceId: journey-dashboard-failed
      x: 700
      y: 460
      width: 220
      height: 120
      laneId: journey-recovery-lane
