name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Install workspace tools
        run: |
          dart pub global activate melos 8.3.0
          dart pub global activate jaspr_cli 0.23.3
      - name: Bootstrap workspace
        run: melos bootstrap
      - name: Verify portable matrix
        run: melos run ci

  hosted-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
        env:
          POSTGRES_PASSWORD: workspace-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: workspace-ci-only
      CONTROL_PLANE_DATABASE_URL: postgresql://postgres:workspace-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      REMOTE_SCHEDULER_DATABASE_URL: postgresql://control_plane_app:workspace-ci-app-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Install Melos
        run: dart pub global activate melos 8.3.0
      - name: Bootstrap workspace
        run: melos bootstrap
      - name: Verify PostgreSQL client compatibility
        run: |
          set -euo pipefail
          psql --version
          pg_dump --version
          pg_restore --version
      - name: Create non-bypass application role
        run: >-
          psql "$CONTROL_PLANE_DATABASE_URL" --set=ON_ERROR_STOP=1
          --command="CREATE ROLE control_plane_app LOGIN PASSWORD 'workspace-ci-app-only' NOBYPASSRLS NOSUPERUSER;"
      - name: Apply expand and contract migrations
        env:
          MIGRATION_DATABASE_URL: ${{ env.CONTROL_PLANE_DATABASE_URL }}
          MIGRATION_DIRECTORY: apps/hosted_control_plane/migrations
        run: dart run apps/hosted_control_plane/bin/migrate.dart
      - name: Grant least-privilege application access
        run: |
          set -euo pipefail
          psql "$CONTROL_PLANE_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA control_plane TO control_plane_app;
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON ALL TABLES IN SCHEMA control_plane TO control_plane_app;
          GRANT EXECUTE ON FUNCTION
            control_plane.scheduler_expired_tenants(timestamptz),
            control_plane.scheduler_queued_tenants(),
            control_plane.scheduler_cleanup_tenants(timestamptz)
            TO control_plane_app;
          SQL
      - name: Verify hosted PostgreSQL boundary
        run: melos run hosted:postgres
      - name: Rehearse backup, restore, and recovery objectives
        shell: bash
        run: |
          set -euo pipefail
          backup_directory="$RUNNER_TEMP/workspace-backups"
          result="$(CONTROL_PLANE_BACKUP_DIRECTORY="$backup_directory" ./tools/hosted/backup_postgres.sh)"
          printf '%s\n' "$result"
          backup="$(printf '%s\n' "$result" | sed -n 's/^backup=//p')"
          test -n "$backup"
          CONTROL_PLANE_BACKUP_FILE="$backup" ./tools/hosted/restore_rehearsal.sh
