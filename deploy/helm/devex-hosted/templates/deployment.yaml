apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devex-hosted.name" . }}
  labels:
    {{- include "devex-hosted.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "devex-hosted.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devex-hosted.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "devex-hosted.name" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: control-plane
          image: {{ include "devex-hosted.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          envFrom:
            - configMapRef: {name: {{ include "devex-hosted.name" . }}}
            - secretRef: {name: {{ .Values.existingSecret }}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.remote.enabled }}
            - name: remote-secrets
              mountPath: /var/run/devex-secrets
              readOnly: true
            - name: kubernetes-api-token
              mountPath: /var/run/devex-kubernetes
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        {{- if .Values.remote.enabled }}
        - name: remote-secrets
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 288
            items:
              - key: {{ .Values.remote.signingJwkSecretKey }}
                path: remote-signing.jwk
        - name: kubernetes-api-token
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
        {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "devex-hosted.selectorLabels" . | nindent 14 }}
