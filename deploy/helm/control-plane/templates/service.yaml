apiVersion: v1
kind: Service
metadata:
  name: {{ include "control-plane.name" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "control-plane.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}
