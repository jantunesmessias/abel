{{- if and .Values.ingress.enabled (or (empty .Values.networkPolicy.ingressController.namespaceLabels) (empty .Values.networkPolicy.ingressController.podLabels)) -}}
{{- fail "networkPolicy ingress controller namespaceLabels and podLabels are required when ingress is enabled" -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "control-plane.name" . }}-default-deny
spec:
  podSelector:
    matchLabels:
      {{- include "control-plane.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if .Values.ingress.enabled }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8080}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    {{- range .Values.networkPolicy.allowedEgressCidrs }}
    - to:
        - ipBlock: {cidr: {{ .cidr | quote }}}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
